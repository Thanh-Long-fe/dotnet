# Chỉ phục vụ static của Admin FE. KHÔNG proxy /api — FE gọi thẳng API qua
# URL tuyệt đối đã nhúng lúc build (VITE_API_BASE_URL). Vì gọi khác origin nên
# backend phải cho phép origin của trang này trong Cors:AllowedOrigins.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Asset có hash trong tên -> cache dài vô tư.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA một trang: mọi đường dẫn không phải file thật đều trả index.html
    # để routing phía client tự xử lý (F5 giữa chừng không ra 404).
    location / {
        try_files $uri $uri/ /index.html;
    }
}
